<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>FG Psicologia</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FG Psicologia">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F4BE5E">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root{--amarelo:#F4BE5E;--escuro:#3A2A10;--verde:#2E7D32;--fundo:#ffffff;--texto:#1F2933;--erro:#B3261E}
  html,body{margin:0;height:100%;background:var(--fundo);color:var(--texto);font:18px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
  #painel{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0);bottom:0;width:100%;height:calc(100% - env(safe-area-inset-top,0px));border:0;display:none;background:#fff}
  #cfg{display:none;box-sizing:border-box;max-width:520px;margin:0 auto;padding:calc(24px + env(safe-area-inset-top,0px)) 16px 24px}
  .logo{width:84px;height:84px;border-radius:20px;display:block;margin:0 auto 12px}
  h1{font-size:24px;text-align:center;margin:0 0 18px}
  p{margin:0 0 14px}
  textarea{width:100%;box-sizing:border-box;font:16px/1.4 inherit;font-family:inherit;padding:12px;border:1.5px solid #C9D6DF;border-radius:12px;min-height:110px;resize:none}
  button{display:block;width:100%;margin-top:14px;padding:16px;border:0;border-radius:14px;background:var(--verde);color:#fff;font:600 18px/1.2 inherit;font-family:inherit}
  #erro{color:var(--erro);min-height:1.4em;margin-top:10px}
  small{display:block;color:#5A6570;margin-top:18px;font-size:15px}
</style>
</head>
<body>
<iframe id="painel" title="Painel FG Psicologia" allow="clipboard-read; clipboard-write; web-share; fullscreen" referrerpolicy="no-referrer"></iframe>

<div id="cfg">
  <img class="logo" src="apple-touch-icon.png" alt="">
  <h1>FG Psicologia</h1>
  <p>Na primeira vez, cole aqui o endereço do painel que chegou por e-mail. Ele fica guardado só neste aparelho.</p>
  <textarea id="end" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Cole o endereço aqui"></textarea>
  <button id="ok" type="button">Salvar e Abrir</button>
  <div id="erro"></div>
  <small>Este endereço não fica nesta página nem na internet: só neste celular.</small>
</div>

<script>
(function(){
  var CHAVE = 'fgPainelEnd';
  function ler(){ try { return localStorage.getItem(CHAVE) || ''; } catch (e) { return ''; } }
  function gravar(v){ try { localStorage.setItem(CHAVE, v); return true; } catch (e) { return false; } }
  function apagar(){ try { localStorage.removeItem(CHAVE); } catch (e) {} }
  /* só aceita o endereço do próprio painel (Google Apps Script, com a chave do painel) */
  function valido(u){ return /^https:\/\/script\.google\.com\/(a\/[^\/]+\/)?macros\/s\/[A-Za-z0-9_-]+\/exec\?(.*&)?painel=[^&\s]+/.test(u); }
  function abrir(u){
    document.getElementById('cfg').style.display = 'none';
    var f = document.getElementById('painel');
    f.src = u; f.style.display = 'block';
  }
  function configurar(){
    document.getElementById('painel').style.display = 'none';
    document.getElementById('cfg').style.display = 'block';
    var t = document.getElementById('end'), er = document.getElementById('erro');
    document.getElementById('ok').onclick = function(){
      var u = String(t.value || '').replace(/\s+/g, '');
      if (!valido(u)) { er.textContent = 'Este não parece o endereço do painel. Copie de novo o link inteiro do e-mail.'; return; }
      if (!gravar(u)) { er.textContent = 'Este celular não deixou guardar. Tente abrir pelo ícone da tela de início.'; return; }
      t.value = ''; abrir(u);
    };
  }
  /* #trocar no fim do endereço: esquece o endereço guardado e pede de novo */
  if (location.hash === '#trocar') { apagar(); history.replaceState(null, '', location.pathname); }
  var u = ler();
  if (u && valido(u)) abrir(u); else configurar();
})();
</script>
</body>
</html>
